<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLPath — Learn SQL Visually</title>
  <meta name="description" content="Interactive SQL course, playground, visual explainer and interview prep on a Healthcare Billing sample database.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='8' rx='11' ry='4' fill='none' stroke='%237aa2f7' stroke-width='2.5'/><path d='M5 8v16c0 2.2 4.9 4 11 4s11-1.8 11-4V8' fill='none' stroke='%237aa2f7' stroke-width='2.5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/er.css">
  <script>/* apply the saved theme before first paint */try{var t=localStorage.getItem('sqlpath.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}</script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Course curriculum"></aside>
    <main id="main" class="main"></main>
    <aside id="explorer" class="explorer" aria-label="Database explorer"></aside>
  </div>
  <div class="scrim" onclick="document.body.classList.remove('show-sidebar')"></div>

  <!-- SQLite engine (sql.js, wasm embedded so the app also works from file://) -->
  <script src="vendor/sql-wasm-binary.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <!-- Data & content -->
  <script src="js/seed.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/lessons/registry.js"></script>
  <script src="js/lessons/foundations.js"></script>
  <script src="js/lessons/fundamentals.js"></script>
  <script src="js/lessons/filtering.js"></script>
  <script src="js/lessons/aggregates.js"></script>
  <script src="js/lessons/joins.js"></script>
  <script src="js/lessons/subqueries.js"></script>
  <script src="js/lessons/windows.js"></script>
  <script src="js/lessons/setops.js"></script>
  <script src="js/lessons/execution.js"></script>
  <script src="js/lessons/optimization.js"></script>
  <script src="js/lessons/dialects.js"></script>
  <script src="js/lessons/dml.js"></script>
  <script src="js/lessons/ddl.js"></script>
  <script src="js/lessons/advanced.js"></script>
  <script src="js/lessons/projects.js"></script>
  <script src="js/lessons/security.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/interview.js"></script>
  <!-- App -->
  <script src="js/ui.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/db.js"></script>
  <script src="js/schema-docs.js"></script>
  <script src="js/er.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/interview-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
